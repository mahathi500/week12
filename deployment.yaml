
apiVersion: apps/v1

kind: Deployment

metadata:
  name: week12app-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: week12app

  template:
    metadata:
      labels:
        app: week12app

    spec:
      containers:
        - name: week12app

          image: shreyachundi/week8_docker:week12image

          ports:
            - containerPort: 5003
